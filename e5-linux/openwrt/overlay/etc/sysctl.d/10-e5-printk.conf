# Match the real-root policy already used by the Debian image. Vendor audio
# controls log synchronously to the 115200-baud console at boot loglevel 7,
# adding seconds to call setup and routing. Keep error output on the console;
# all levels remain in the kernel ring buffer for dmesg/logread and debugging.
# The initramfs keeps its verbose console for early boot diagnostics.
kernel.printk = 4 4 1 7
